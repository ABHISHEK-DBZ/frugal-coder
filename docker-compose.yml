version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: frugal-coder-backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite:///./frugal_coder.db
      - BIFROST_URL=http://bifrost:8080
      - OLLAMA_URL=http://host.docker.internal:11434
    volumes:
      - ./data:/app/data
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: frugal-coder-frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000/api/v1
    depends_on:
      - backend
    restart: unless-stopped

